<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devi's Fall & Gupteshwor Cave — Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- state-specific background, swapped by JS on location change -->
  <div id="background" class="background" aria-hidden="true"></div>
  <div class="background-overlay" aria-hidden="true"></div>

  <!-- top bar: current location + connection status -->
  <header class="topbar">
    <div class="location-badge">
      <span class="location-dot"></span>
      <span id="location-name">Loading…</span>
    </div>
    <div class="status-pill" id="status-pill">connecting…</div>
  </header>

  <!-- narration panel: shows guide's spoken/written responses -->
  <main class="narration-wrap">
    <div class="narration-panel" id="narration-panel" aria-live="polite">
      <p class="narration-empty" id="narration-empty">Tap the microphone and ask your guide anything about where you're standing.</p>
    </div>
  </main>

  <!-- context-aware action chips -->
  <div class="chips-row" id="chips-row" aria-label="Suggested actions"></div>

  <!-- input controls: mic (primary) + text fallback -->
  <footer class="controls">
    <button id="mic-btn" class="mic-btn" aria-label="Hold to speak" title="Click to speak">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
        <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="currentColor"/>
        <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <form id="text-form" class="text-form" autocomplete="off">
      <input id="text-input" type="text" placeholder="Or type your question…" aria-label="Type your question">
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 12h16M14 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
